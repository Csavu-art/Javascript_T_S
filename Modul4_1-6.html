<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 4 AJAX</title>
  <script src="Modul4_J1-6.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      background: #f4f4f4;
      color: #222;
    }

    h1, h2 {
      margin-top: 30px;
    }

    form {
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 8px;
      width: 250px;
    }

    button, input[type="submit"] {
      padding: 8px 12px;
      cursor: pointer;
    }

    #results, #jokeResults {
      margin-top: 20px;
    }

    article {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    img {
      display: block;
      margin: 10px 0;
      max-width: 210px;
      height: auto;
    }

    a {
      color: blue;
    }
  </style>
</head>
<body>
  <h1>Module 4 AJAX</h1>

  <h2>TV Show Search</h2>
  <form id="tvForm">
    <input id="query" name="q" type="text" placeholder="Enter TV series name" required>
    <input type="submit" value="Search">
  </form>

  <div id="results"></div>

  <hr>

  <h2>Random Chuck Norris Joke</h2>
  <button id="randomJokeBtn">Get Random Joke</button>

  <hr>

  <h2>Search Chuck Norris Jokes</h2>
  <form id="jokeForm">
    <input id="jokeQuery" type="text" placeholder="Enter search term" required>
    <input type="submit" value="Search Jokes">
  </form>

  <div id="jokeResults"></div>
</body>
</html>
