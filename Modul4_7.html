<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reitti kouluun</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 16px;
      background: #f4f4f4;
      color: #222;
    }

    h1 {
      margin-bottom: 10px;
    }

    form {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 320px;
      padding: 8px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #map {
      height: 500px;
      margin-top: 20px;
      border: 1px solid #bbb;
    }

    #tripInfo {
      margin-top: 15px;
      padding: 12px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .error {
      color: darkred;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Reitti kouluun</h1>

  <form id="routeForm">
    <input
      type="text"
      id="addressInput"
      placeholder="Kirjoita lähtöosoite"
      required
    />
    <button type="submit">Hae reitti</button>
  </form>

  <div id="tripInfo">Anna osoite ja hae reitti.</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    'use strict';

    const DIGITRANSIT_API_KEY = 'https://api.digitransit.fi/routing/v2/finland/gtfs/v1';

    const form = document.querySelector('#routeForm');
    const addressInput = document.querySelector('#addressInput');
    const tripInfo = document.querySelector('#tripInfo');

    const schoolAddress = 'Karaportti 2, Espoo';

    const map = L.map('map').setView([60.1708, 24.9375], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let routeLine = null;
    let startMarker = null;
    let endMarker = null;

    async function getCoordinates(address) {
      const url =
        `https://api.digitransit.fi/geocoding/v1/search` +
        `?text=${encodeURIComponent(address)}` +
        `&size=1` +
        `&lang=fi` +
        `&digitransit-subscription-key=${DIGITRANSIT_API_KEY}`;

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`HTTP virhe: ${response.status}`);
      }

      const data = await response.json();

      if (!data.features || data.features.length === 0) {
        throw new Error(`Osoitetta ei löytynyt: ${address}`);
      }

      const feature = data.features[0];
      const lon = feature.geometry.coordinates[0];
      const lat = feature.geometry.coordinates[1];

      return { lat, lon };
    }

    async function getRoute(from, to) {
      const query = `
        query GetRoute($fromLat: Float!, $fromLon: Float!, $toLat: Float!, $toLon: Float!) {
          plan(
            from: {lat: $fromLat, lon: $fromLon}
            to: {lat: $toLat, lon: $toLon}
            numItineraries: 1
          ) {
            itineraries {
              startTime
              endTime
              legs {
                mode
                startTime
                endTime
                legGeometry {
                  points
                }
              }
            }
          }
        }
      `;

      const variables = {
        fromLat: from.lat,
        fromLon: from.lon,
        toLat: to.lat,
        toLon: to.lon
      };

      const response = await fetch(
        'https://api.digitransit.fi/routing/v1/routers/finland/index/graphql',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'digitransit-subscription-key': DIGITRANSIT_API_KEY
          },
          body: JSON.stringify({
            query,
            variables
          })
        }
      );

      if (!response.ok) {
        throw new Error(`HTTP virhe: ${response.status}`);
      }

      const data = await response.json();

      if (!data.data || !data.data.plan || !data.data.plan.itineraries || data.data.plan.itineraries.length === 0) {
        throw new Error('Reittiä ei löytynyt.');
      }

      return data.data.plan.itineraries[0];
    }

    function decodePolyline(encoded) {
      let points = [];
      let index = 0;
      let lat = 0;
      let lng = 0;

      while (index < encoded.length) {
        let b;
        let shift = 0;
        let result = 0;

        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);

        const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
        lat += dlat;

        shift = 0;
        result = 0;

        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);

        const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
        lng += dlng;

        points.push([lat / 1e5, lng / 1e5]);
      }

      return points;
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString('fi-FI', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      tripInfo.textContent = 'Haetaan reittiä...';

      try {
        const userAddress = addressInput.value.trim();

        const fromCoords = await getCoordinates(userAddress);
        const toCoords = await getCoordinates(schoolAddress);

        const itinerary = await getRoute(fromCoords, toCoords);

        if (routeLine) {
          map.removeLayer(routeLine);
        }
        if (startMarker) {
          map.removeLayer(startMarker);
        }
        if (endMarker) {
          map.removeLayer(endMarker);
        }

        const allPoints = [];

        itinerary.legs.forEach(leg => {
          if (leg.legGeometry && leg.legGeometry.points) {
            const decoded = decodePolyline(leg.legGeometry.points);
            allPoints.push(...decoded);
          }
        });

        routeLine = L.polyline(allPoints).addTo(map);

        startMarker = L.marker([fromCoords.lat, fromCoords.lon])
          .addTo(map)
          .bindPopup('Lähtö');

        endMarker = L.marker([toCoords.lat, toCoords.lon])
          .addTo(map)
          .bindPopup('Koulu: Karaportti 2');

        map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });

        tripInfo.innerHTML = `
          <strong>Lähtö:</strong> ${formatTime(itinerary.startTime)}<br>
          <strong>Saapuminen:</strong> ${formatTime(itinerary.endTime)}
        `;

        console.log(itinerary);
      } catch (error) {
        console.error(error);
        tripInfo.innerHTML = `<span class="error">${error.message}</span>`;
      }
    });
  </script>
</body>
</html>
